[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "news-mcp-server"
version = "0.1.0"
description = "An independent, persistent MCP server for trusted news sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21,<1",
    "feedparser>=6.0,<7",
    "httpx>=0.28,<1",
    "langchain[mcp]>=1.4.7,<2",
    "langchain-groq>=1.1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "mcp>=2.0,<3",
    "pydantic>=2.11,<3",
    "python-telegram-bot[job-queue]>=22.8,<23",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
news-mcp = "news_mcp.server:main"
news-bot = "news_bot.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

